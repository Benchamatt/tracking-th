<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weiming Tracking</title>

  <style>
    :root{
      --bg:#f6f8fb;
      --surface:#ffffff;
      --surface-2:#f1f4f9;
      --text:#0f172a;
      --muted:#64748b;
      --border:#e5e7eb;
      --shadow: 0 10px 24px rgba(2, 6, 23, 0.08);

      --brand:#0f5fbf;
      --brand-2:#0a3f7a;

      --ok:#0f766e;
      --warn:#b45309;
      --bad:#b91c1c;

      --badge-bg: rgba(15, 95, 191, 0.10);
      --badge-text: #0f5fbf;

      --ring: rgba(15,95,191,.25);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, rgba(15,95,191,.10), transparent 60%),
                  radial-gradient(1000px 500px at 90% 0%, rgba(15,95,191,.08), transparent 55%),
                  var(--bg);
      color:var(--text);
    }

    .wrap{max-width:980px;margin:0 auto;padding:20px 14px 28px}

    .topbar{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding: 14px 16px;
      border:1px solid var(--border);
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(15,95,191,.12), rgba(15,95,191,.04));
      box-shadow: var(--shadow);
    }

    .brand{display:flex;align-items:center;gap:10px;min-width:0}
    .logo{
      width:40px;height:40px;border-radius:12px;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      display:grid;place-items:center;
      box-shadow: 0 10px 18px rgba(15,95,191,.25);
    }
    .logo svg{width:22px;height:22px;fill:#fff}

    .brand h1{margin:0;font-size:16px}
    .brand .sub{font-size:12px;color:var(--muted)}

    .grid{
      display:grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 14px;
      margin-top: 14px;
    }

    @media(max-width:860px){
      .grid{grid-template-columns:1fr}
    }

    .card{
      background: var(--surface);
      border:1px solid var(--border);
      border-radius:16px;
      box-shadow: var(--shadow);
      padding:16px;
    }

    .muted{color:var(--muted); font-size:13px}

    .searchRow{
      display:grid;
      grid-template-columns: 1fr 132px;
      gap:10px;
      margin-top:10px;
    }

    input{
      padding:12px 14px;
      border-radius:14px;
      border:1px solid var(--border);
      background: var(--surface-2);
    }

    input:focus{
      outline:3px solid var(--ring);
      border-color:transparent;
    }

    .btn{
      border:none;
      border-radius:14px;
      padding:12px;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      color:#fff;
      cursor:pointer;
    }

    /* =========================
       BADGE (FIXED - ไม่มีซ้อน style แล้ว)
    ========================= */
    .badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 10px;
      border-radius:999px;
      background: var(--badge-bg);
      color: var(--badge-text);
      border:1px solid rgba(15,95,191,.18);
      font-size:12px;
      font-weight:700;
      white-space:nowrap;
    }

    .dot{
      width:8px;
      height:8px;
      border-radius:999px;
      background: currentColor;
      opacity:.95;
    }

    .badge.ok{
      background: rgba(15,118,110,.12);
      color: var(--ok);
      border-color: rgba(15,118,110,.25);
    }

    .badge.warn{
      background: rgba(180,83,9,.12);
      color: var(--warn);
      border-color: rgba(180,83,9,.25);
    }

    .badge.bad{
      background: rgba(185,28,28,.12);
      color: var(--bad);
      border-color: rgba(185,28,28,.25);
    }

    .badge.orange{
      background: rgba(234,88,12,.12);
      color:#ea580c;
      border-color: rgba(234,88,12,.25);
    }

    .badge.blue{
      background: rgba(15,95,191,.12);
      color: var(--brand);
      border-color: rgba(15,95,191,.25);
    }

  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 24 24">
            <path d="M20 8h-3V4H3v13h2.1a2.9 2.9 0 0 0 5.8 0h4.2a2.9 2.9 0 0 0 5.8 0H23v-5l-3-4z"/>
          </svg>
        </div>
        <div>
          <h1>Weiming Tracking</h1>
          <div class="sub">ระบบตรวจสอบสถานะพัสดุ</div>
        </div>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="muted">ค้นหาเลขพัสดุ</div>

        <div class="searchRow">
          <input placeholder="เลขพัสดุ" />
          <button class="btn">ค้นหา</button>
        </div>
      </div>

      <div class="card">
        <div class="badge ok">
          <span class="dot"></span>
          ถึงแล้ว
        </div>
      </div>
    </div>
  </div>
</body>
</html>
